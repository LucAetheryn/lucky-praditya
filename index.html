<style>
    /* Base Reset & Prevent Horizontal Overflow */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #03050a;
      color: #f8fafc;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Fullscreen Cosmic Canvas */
    #cosmos-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      pointer-events: none;
    }

    /* Subtle Cinema Film Grain Overlay */
    .film-grain {
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.032;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      animation: grainShift 8s steps(10) infinite;
    }

    @keyframes grainShift {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-2%, -3%); }
      20% { transform: translate(-4%, 2%); }
      30% { transform: translate(3%, -4%); }
      40% { transform: translate(-2%, 4%); }
      50% { transform: translate(4%, 1%); }
      60% { transform: translate(-3%, -2%); }
      70% { transform: translate(2%, 3%); }
      80% { transform: translate(-1%, -4%); }
      90% { transform: translate(3%, 2%); }
    }

    /* Cinematic Vignette */
    .cinema-vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, transparent 45%, rgba(3, 5, 10, 0.72) 100%);
    }

    /* Typography Light Sweep Effect */
    .brand-shimmer {
      background: linear-gradient(
        110deg,
        rgba(255, 248, 231, 0.85) 0%,
        rgba(255, 255, 255, 1) 42%,
        rgba(125, 211, 252, 0.95) 50%,
        rgba(255, 255, 255, 1) 58%,
        rgba(255, 248, 231, 0.85) 100%
      );
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: lightSweep 7s ease-in-out infinite;
    }

    @keyframes lightSweep {
      0% { background-position: 200% center; }
      50% { background-position: 0% center; }
      100% { background-position: -200% center; }
    }

    /* Glassmorphic Executive Cards */
    .cosmic-glass {
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.45), rgba(9, 17, 36, 0.28));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.14);
      box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.65), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, background 0.4s ease;
    }

    .cosmic-glass:hover {
      border-color: rgba(125, 211, 252, 0.32);
      background: linear-gradient(145deg, rgba(22, 33, 62, 0.56), rgba(14, 22, 46, 0.38));
      transform: translateY(-3px);
    }

    /* Smooth Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #03050a;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(125, 211, 252, 0.25);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(125, 211, 252, 0.45);
    }

    /* Custom Range Slider for Cosmic Controls */
    input[type="range"].cosmic-slider {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(148, 163, 184, 0.18);
      height: 4px;
      border-radius: 999px;
      outline: none;
    }
    input[type="range"].cosmic-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #7dd3fc;
      box-shadow: 0 0 12px rgba(125, 211, 252, 0.85);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    input[type="range"].cosmic-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
  
.font-cinzel { font-family: 'Cinzel', Georgia, serif; }
.font-space { font-family: 'Space Grotesk', Arial, sans-serif; }
/* Integration layer: preserve the legacy app layout beneath the new cosmic intro. */
html, body { min-height: 100%; height: auto; }
body { min-height: 100vh; overflow-x: hidden; background: #03050a; }
#main-interface { min-height: 100vh; width: 100%; }
#main-interface #adm, #main-interface #site, #main-interface #ov { position: relative; z-index: 1; }
#cosmic-toast { z-index: 50; }
@media (prefers-reduced-motion: reduce) {
  .film-grain, .brand-shimmer { animation: none !important; }
  *, *::before, *::after { scroll-behavior: auto !important; }
}</style>
